<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Software Analyst Practice Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="start-screen" class="card screen active">
      <p class="eyebrow">Practice Test</p>
      <h1>Software Analyst</h1>
      <p class="intro">Answer 100 mobile-friendly multiple choice questions about application support, business analysis, databases, testing, documentation, SDLC, security, and customer service.</p>
      <button id="start-btn" class="primary-btn">Start Test</button>
    </section>

    <section id="quiz-screen" class="card screen">
      <div class="top-bar">
        <span id="question-count">Question 1 of 100</span>
        <span id="score-live">Score: 0</span>
      </div>
      <div class="progress-wrap"><div id="progress-bar"></div></div>
      <h2 id="question-text"></h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback"></p>
      <button id="next-btn" class="primary-btn hidden">Next Question</button>
    </section>

    <section id="result-screen" class="card screen">
      <p class="eyebrow">Finished</p>
      <h1>Your Results</h1>
      <div id="final-score" class="final-score"></div>
      <p id="result-message"></p>
      <div id="review-list" class="review-list"></div>
      <button id="restart-btn" class="primary-btn">Restart Test</button>
    </section>
  </main>
  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
